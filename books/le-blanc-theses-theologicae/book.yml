title: "Theological Theses (De Theologia tip)"
author: "Louis Le Blanc de Beaulieu"
description: "New English rendering of Louis Le Blanc de Beaulieu's Theological Theses for private study, prepared with AI assistance from the Latin text of the 1675 London edition. This volume covers the Theses on Theology I-VII (theology as speech about God; whether it is required for salvation and for the church) in 2 sections; the remainder of the collected Theses is not in this volume. No modern copyrighted translation was copied."
