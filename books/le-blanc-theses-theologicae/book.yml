description: "The Theological Theses range across the whole Reformed system — Scripture, God, predestination, grace, and justifying faith — in the crisp thesis-and-proof form of the seventeenth-century schools. This volume holds the Theses on Theology I–XLIII and On Faith I–XXII, in eighteen sections. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
