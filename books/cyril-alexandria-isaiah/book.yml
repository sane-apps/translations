description: "His Commentary on Isaiah reads the prophet as the evangelist of the Old Testament: judgment on unfaithful Israel, comfort for the remnant, and the suffering Servant who is Christ. This volume holds the prologue and Books 2 through 5. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
