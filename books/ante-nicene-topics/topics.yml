# Owned taxonomy — Ante-Nicene Dogmatics (ONE book).
# Do not copy Bercot. Corpus: all ante-Nicene voices (majors and minors).

version: 2
mvp: false
one_book: true
corpus_policy: all_ante_nicene_voices
# Builder ships only topics that have excerpts; empty topics stay as map for seeds.

# `summary` is the reader-facing intro and page description for a topic.
# `modern_relevance` is an editor note (keyword hints); readers never see it.
# `keywords_from` (editor field): the title words used to pick each card's
# opening sentence, kept from before a topic was retitled or added.

# Old excerpt topic ids folded into a real topic. The site builder applies
# these before building pages and writes a 301 from each old /topics/<id>/.
aliases:
  image-and-likeness: image-likeness
  atonement-and-recapitulation: atonement-recapitulation
  hope-and-resurrection: resurrection-body
  providence-and-mission: providence-and-care
  grace-and-human-response: true-worship

loci:
  - id: bibliology
    title: Bibliology, Canon, Hermeneutics
    mvp: false
    topics:
      - id: scripture-inspiration
        title: Scripture and Inspiration
        heresies: []
        development: consensus
        modern_relevance: "Prophetic Spirit and God-breathed writings before later inerrancy slogans."
        summary: "How the early writers spoke of the Scriptures as words given by God through the prophets and apostles."
      - id: canon-rule-of-truth
        title: Canon and the Rule of Truth
        heresies: [marcionism, gnosticism]
        development: consensus
        modern_relevance: "Apostolic deposit and rule of faith against private gospels."
        summary: "Which books the churches read as Scripture, and the short summary of the faith they used to test any teaching."
      - id: old-and-new
        title: "One God, Old and New Testaments"
        keywords_from: "Old and New Continuity"
        heresies: [marcionism]
        development: consensus
        modern_relevance: "One God of both Testaments."
        summary: "The same God speaks in the Old Testament and the New, against those who set the two against each other."
      - id: hermeneutics-types
        title: "Reading Scripture: Types and Figures"
        keywords_from: "Hermeneutics and Types"
        heresies: []
        development: debate
        modern_relevance: "Type, allegory, and literal reading — mark development; do not flatten Origen."
        summary: "How they read the Old Testament: as plain history, as pictures that point ahead to Christ, and at times as allegory."
      - id: lxx-and-form
        title: "Which Bible Text They Quoted"
        keywords_from: "Form of Scripture They Used"
        heresies: []
        development: seed
        modern_relevance: "They quote LXX / Old Latin; do not correct them to NA28/ESV."
        summary: "They mostly quoted the Greek Old Testament and the old Latin versions, so their wording can differ from a modern Bible."
      - id: law-and-gospel
        title: "The Law and the Gospel"
        heresies: []
        development: consensus
        keywords_from: "law and gospel"
        summary: "How Christ treated the Law of Moses: keeping it, fulfilling it and asking more of it, not throwing it away as the work of another god."
      - id: apostolic-tradition
        title: "Apostolic Tradition"
        heresies: []
        development: consensus
        keywords_from: "apostolic tradition"
        summary: "Why they held that the faith handed down from the apostles came first, and that any newer teaching must be tested by it."

  - id: theology-proper
    title: Theology Proper and Trinity
    mvp: false
    topics:
      - id: one-god-creator
        title: One God the Creator
        heresies: [gnosticism, marcionism]
        development: consensus
        modern_relevance: "Monotheism against dual creators and fate-gods."
        summary: "There is one God, who made heaven and earth and all that is in them, not a lesser maker or a pair of rival gods."
      - id: father-son-spirit
        title: Father, Son, and Spirit
        heresies: [modalism, adoptionism]
        development: seed
        modern_relevance: "Pre-Nicene triadic language — honest, not anachronistic slogans."
        summary: "How the writers before Nicaea spoke of the Father, the Son and the Holy Spirit, in their own words and before the later creeds."
      - id: attributes-providence
        title: Attributes and Providence
        heresies: [stoic-fate]
        development: consensus
        modern_relevance: "Goodness, justice, and providence without coercion."
        summary: "What God is like, good, just and all-knowing, and how he guides the world without forcing anyone’s choices."
      - id: against-idols
        title: Against Idols
        heresies: []
        development: consensus
        modern_relevance: "Apologetic monotheism for pagan hearers."
        summary: "Why Christians would not worship statues or the gods of Rome, and how they argued with those who did."
      - id: true-worship
        title: "True Worship"
        heresies: []
        development: consensus
        keywords_from: "true worship"
        summary: "What it means to worship the one true God, in prayer and in a just and merciful life, set against the temples, sacrifices and old gods of Rome."
      - id: providence-and-care
        title: "God’s Care for His Creatures"
        heresies: []
        development: consensus
        keywords_from: "providence and care"
        summary: "God feeds, clothes and looks after what he has made, and that care shows he is good and the same God who made the world."

  - id: christology
    title: Christology
    mvp: false
    topics:
      - id: incarnation-word-flesh
        title: Incarnation — Word Made Flesh
        heresies: [docetism]
        development: consensus
        modern_relevance: "True assumption of human life."
        summary: "The Son of God truly became a human being, with real flesh and a real human life."
      - id: two-natures-seed
        title: True God and True Man
        heresies: [docetism, ebionitism]
        development: seed
        modern_relevance: "Seed language before Chalcedon formulas."
        summary: "Christ is both truly God and truly human, as the early writers put it long before the Council of Chalcedon."
      - id: virgin-birth
        title: Virgin Birth
        heresies: []
        development: consensus
        modern_relevance: "Mary and the virgin birth in ante-Nicene witness."
        summary: "Mary conceived Jesus as a virgin, by the power of the Holy Spirit."
      - id: passion-resurrection
        title: Passion and Resurrection
        heresies: [docetism]
        development: consensus
        modern_relevance: "Real death and rising."
        summary: "Christ really suffered, died and rose again from the dead."
      - id: against-docetism
        title: "Christ’s Body Was Real"
        keywords_from: "Against Docetism"
        heresies: [docetism]
        development: consensus
        modern_relevance: "Ignatius and Irenaeus against a phantasm Christ."
        summary: "Against teachers who said Christ only seemed to have a body and only seemed to suffer."
      - id: unity-of-christ
        title: "The One Christ"
        heresies: []
        development: consensus
        keywords_from: "unity of christ"
        summary: "There is one Christ, the one the prophets foretold and the apostles preached, not a second Christ from some other god."

  - id: pneumatology
    title: Pneumatology and Charismata
    mvp: false
    topics:
      - id: spirit-prophecy
        title: Spirit and Prophecy
        heresies: []
        development: consensus
        modern_relevance: "Spirit in prophets and apostles."
        summary: "The Holy Spirit spoke through the prophets and apostles, and still gave prophecy in the early churches."
      - id: spirit-and-baptism
        title: Spirit and Baptism
        heresies: []
        development: consensus
        modern_relevance: "Spirit with initiation into new life."
        summary: "How the Holy Spirit is given in baptism and begins new life in the believer."
      - id: gifts-and-order
        title: Gifts and Order
        heresies: [montanism]
        development: debate
        modern_relevance: "Charismata still reported in the churches (healings, prophecy, tongues), tested by life and ordered with bishops/teachers; Montanism labeled as debate over who owns the prophetic Spirit."
        summary: "Healing, prophecy and the other gifts of the Spirit in the churches, and how they were tested and kept in order."
      - id: spirit-sanctifies
        title: Spirit Who Sanctifies
        heresies: []
        development: seed
        modern_relevance: "Holiness and new life by the Spirit."
        summary: "The Holy Spirit makes believers holy and changes the way they live."

  - id: anthropology
    title: Anthropology, Free Will, Sin
    mvp: true
    topics:
      - id: image-likeness
        title: Image and Likeness
        heresies: [gnosticism, valentinianism]
        development: consensus
        modern_relevance: "Human dignity and moral agency as creational, not deterministic."
        summary: "What it means that God made human beings in his image and likeness."
      - id: free-will
        title: Free Will
        heresies: [stoic-fate, gnostic-natures, astrological-determinism]
        development: consensus
        modern_relevance: "Pre-Augustinian fathers widely affirm self-determining power against fate."
        summary: "Human beings can truly choose good or evil; they are not driven by fate, the stars or their nature."
      - id: fate-and-foreknowledge
        title: Fate and Foreknowledge
        heresies: [stoic-fate]
        development: consensus
        modern_relevance: "Prophecy and necessity arguments do not cancel accountability."
        summary: "God knows the future, but his knowing it does not force anyone’s choice."
      - id: sin-and-death
        title: Sin and Death
        heresies: [gnosticism, marcionism]
        development: consensus
        modern_relevance: "Death and corruption as consequence, not a second creator's work."
        summary: "Where sin and death came from, and why they are not the work of a second, evil creator."
      - id: two-ways
        title: The Two Ways
        heresies: []
        development: seed
        modern_relevance: "Moral catechesis: life vs death, light vs darkness."
        summary: "The old Christian teaching of two ways, one of life and one of death, and how to walk the first."

  - id: soteriology
    title: Soteriology
    mvp: true
    topics:
      - id: salvation-by-christ
        title: Salvation in Christ
        heresies: [marcionism, ebionitism]
        development: consensus
        modern_relevance: "Rescue is through the incarnate Son, not secret knowledge alone."
        summary: "We are saved through Christ, the Son of God made man, not by secret knowledge."
      - id: faith-and-obedience
        title: Faith and Obedience
        heresies: []
        development: consensus
        modern_relevance: "Trust and lived allegiance held together without later slogans."
        summary: "How trusting God and obeying him belong together in the Christian life."
      - id: grace-and-assistance
        title: Grace and Divine Assistance
        heresies: []
        development: debate
        modern_relevance: "God counsels and aids; man is not coerced."
        summary: "God calls and helps people by his grace, without forcing them."
      - id: atonement-recapitulation
        title: "Christ Undoes Adam’s Fall"
        keywords_from: "Recapitulation and Victory"
        heresies: [gnosticism]
        development: seed
        modern_relevance: "Christ sums up and restores the human story (Irenaeus)."
        summary: "Christ goes back over the human story where Adam failed and puts it right, winning the victory over sin and death."
      - id: baptism-and-new-birth
        title: Baptism and New Birth
        heresies: []
        development: consensus
        modern_relevance: "Initiation into forgiveness and new life; linked to willing faith."
        summary: "Baptism brings forgiveness and a new birth to those who freely come to faith."
      - id: reward-and-judgment
        title: Reward and Judgment
        heresies: [stoic-fate]
        development: consensus
        modern_relevance: "Judgment presupposes real choice."
        summary: "God will judge each person by what they have done, which only makes sense if their choices are real."
      - id: universal-call
        title: Universal Call and Human Refusal
        heresies: [gnostic-natures]
        development: consensus
        modern_relevance: "God wills gather; some will not (Mt 23)."
        summary: "God calls everyone to salvation, but some refuse to come."

  - id: ecclesiology
    title: Ecclesiology, Ministry, Succession
    mvp: false
    topics:
      - id: one-church
        title: One Church
        heresies: [schism]
        development: consensus
        modern_relevance: "Unity of the church (Ignatius, Cyprian)."
        summary: "The Church is one, and Christians are to stay united with it and with its bishops."
      - id: bishops-presbyters
        title: Bishops and Presbyters
        heresies: []
        development: consensus
        modern_relevance: "Ministry order in the second and third centuries."
        summary: "Who led the early churches, bishops, presbyters and deacons, and what each was for."
      - id: apostolic-succession
        title: Apostolic Succession
        heresies: [gnosticism]
        development: consensus
        modern_relevance: "Succession and tradition against secret teachers."
        summary: "The churches could name their bishops back to the apostles, and used that to show where the true teaching was kept."
      - id: discipline-penance
        title: Discipline and Penance
        heresies: []
        development: debate
        modern_relevance: "Penance and the lapsi — pastoral debate."
        summary: "How the churches dealt with serious sin, and whether and how those who fell away could be received back."
      - id: heresy-schism
        title: Heresy and Schism
        heresies: [gnosticism, montanism]
        development: consensus
        modern_relevance: "Boundaries of the catholic faith."
        summary: "False teaching and splits from the Church, and how the early writers answered them."
      - id: apostolic-mission
        title: "The Apostles Sent Out"
        heresies: []
        development: consensus
        keywords_from: "apostolic mission"
        summary: "Christ chose the apostles and sent them out to preach, as the prophets had foretold."

  - id: sacraments
    title: Baptism, Eucharist, Liturgy
    mvp: false
    topics:
      - id: eucharist-thanksgiving
        title: Eucharist and Thanksgiving
        heresies: []
        development: debate
        modern_relevance: "Flesh and blood language — mark realism vs symbol carefully."
        summary: "What the early writers said about the bread and cup of the Lord’s Supper."
      - id: liturgy-prayer
        title: Liturgy and Prayer
        heresies: []
        development: seed
        modern_relevance: "Prayer, fasting, Lord’s day."
        summary: "How the early Christians prayed, fasted and met together on the Lord’s Day."
      # Baptism primary under soteriology; cross-ref via registry — one English per locus.

  - id: eschatology
    title: Eschatology and Chiliasm
    mvp: false
    topics:
      - id: resurrection-body
        title: Resurrection of the Body
        heresies: [gnosticism]
        development: consensus
        modern_relevance: "Flesh rises."
        summary: "At the end the dead will rise in their own bodies, not as souls alone."
      - id: judgment-second-coming
        title: Judgment and the Second Coming
        heresies: []
        development: consensus
        modern_relevance: "Return and judgment."
        summary: "Christ will come again to judge the living and the dead."
      - id: millennium-debate
        title: "The Thousand-Year Reign"
        keywords_from: "Millennium Debate"
        heresies: []
        development: debate
        modern_relevance: "Chiliasm — Justin/Irenaeus/Papias vs other streams; mark debate."
        summary: "Whether Christ will reign on earth for a thousand years before the end, a point the early writers did not all agree on."
      - id: heaven-hell-intermediate
        title: "Where the Dead Wait"
        keywords_from: "Intermediate State"
        heresies: []
        development: seed
        modern_relevance: "Interim language carefully; no later system dump."
        summary: "Where the souls of the dead are between death and the final resurrection."

  - id: ethics
    title: Ethics, Martyrdom, Apologetics
    mvp: false
    topics:
      - id: love-neighbor-enemy
        title: Love of Neighbor and Enemy
        heresies: []
        development: consensus
        modern_relevance: "Moral teaching of the two ways and the sermon tradition."
        summary: "Loving your neighbor, and even your enemies, as Jesus taught."
      - id: sexual-marriage
        title: Marriage and Continence
        heresies: []
        development: consensus
        modern_relevance: "Pastoral, not prurient."
        summary: "Marriage, faithfulness and the single life, and how Christians were to live in their bodies."
      - id: wealth-alms
        title: Wealth and Alms
        heresies: []
        development: consensus
        modern_relevance: "Money and mercy."
        summary: "Money, the danger of greed, and giving to the poor."
      - id: martyrdom-witness
        title: Martyrdom as Witness
        heresies: []
        development: consensus
        modern_relevance: "Confession under empire."
        summary: "Christians who died rather than deny Christ, and why their deaths were called witness."
      - id: civil-authority
        title: Civil Authority
        heresies: []
        development: debate
        modern_relevance: "Loyalty limits under pagan rule."
        summary: "How Christians should treat the emperor and the law, and where obedience had to stop."
      - id: apologetic-method
        title: "Answering Pagans and Jews"
        keywords_from: "Apologetic Method"
        heresies: []
        development: seed
        modern_relevance: "How they argued with pagans and Jews."
        summary: "How the early writers explained and defended the faith to pagans and Jews."
