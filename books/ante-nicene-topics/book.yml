description: "This volume arranges their teaching topically rather than author by author: God, Christ, the Spirit, Scripture, salvation, the church, and the Christian life. The reader hears the whole early chorus on each doctrine in turn, each passage headed with its author and date. Each topic joins excerpts from several Fathers with the running argument that connects them, followed by translation notes and a scripture index. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
