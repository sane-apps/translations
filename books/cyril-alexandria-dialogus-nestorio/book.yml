description: "A short dialogue, printed among the works of Cyril of Alexandria, in which Cyril and Nestorius trade Scripture verses over whether the Virgin Mary may be called God-bearer, whether the natures of Christ may be divided, and what the believer receives in the Eucharist. A fresh English translation from the Greek of PG 76."
