description: "Hesychius of Jerusalem, On Lazarus and the Palm Branches, in a fresh English translation for private study, made from the Greek text of PG 93. The raising of Lazarus is the sign that Christ will raise all humanity; Zechariah's call to the daughter of Zion is read phrase by phrase; and the hearers are urged to carry palms of faith, hope, and love and to become a holy temple for Christ. It is a different sermon from Homily II on Saint Lazarus."
