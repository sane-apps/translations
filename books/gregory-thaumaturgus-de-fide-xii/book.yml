title: 'Gregory Thaumaturgus: Twelve Chapters on the Faith'
author: "Gregory Thaumaturgus"
description: "The Twelve Chapters on the Faith are transmitted under Gregory's name, though scholars doubt he wrote them — some ascribe the work to the circle of Apollinaris of Laodicea a century later. This volume holds Chapters 1–2: Christ's body as created flesh of the uncreated Word, and the flesh not consubstantial with the Godhead. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
