description: "Eustathius of Antioch, On Creation in Genesis. Eustathius responds to a philosopher's questions about the creation of animals and humanity in Genesis, defending the distinct creation of humanity in God's image and likeness and the co-creative role of the Son. New English for private study from the locked source. Source: PG 18; In Genesim de creatione (Khazarzar)."
