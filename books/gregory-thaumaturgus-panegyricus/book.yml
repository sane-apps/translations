description: "The Thanksgiving Address to Origen (c. 238) is his farewell oration — part gratitude, part spiritual autobiography, and our fullest portrait of Origen as a teacher. This volume holds the whole address, from his hesitation to speak, through his conversion and Origen's course of study, to his farewell prayer. Fresh English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
