description: "The Thanksgiving Address to Origen (c. 238) is his farewell oration — part gratitude, part spiritual autobiography, and our fullest portrait of Origen as a teacher. This volume holds the opening of the oration: silence preferred, years without oratory, and fear before the subject. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
