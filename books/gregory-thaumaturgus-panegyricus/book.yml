title: "Gregory Thaumaturgus: Panegyricus"
author: "Gregory Thaumaturgus"
description: "New English rendering of Gregory Thaumaturgus's Panegyric and Thanksgiving to Origen for private study, prepared with AI assistance from the Latin text of the Vossius 1684 edition. This volume covers the opening of the oration (silence preferred, eight years without oratory, fear before the subject); the remainder of the oration is not in this volume. No modern copyrighted translation was copied."
