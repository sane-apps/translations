title: 'Epiphanius of Salamis: The Anchor of Faith'
original_title: 'Ancoratus'
author: "Epiphanius of Salamis"
description: "The Anchor of Faith (374) is his exposition of Trinitarian doctrine cast as a ship's anchor for believers tossed by Arianism: Father, Son, and Spirit confessed in unity, the church's faith set out creed by creed. This volume holds Chapter II: the Spirit given to seekers, Peter's confession, and the Trinity in unity. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
