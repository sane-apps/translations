slug: africanus-cesti
title: 'Julius Africanus: The Cesti (selected fragments)'
original_title: 'Cesti'
author: Julius Africanus
description: "The Cesti ('embroidered girdles') were his wide-ranging miscellany of curiosities, spanning military science, farming, medicine, and natural marvels. Only fragments survive, quoted by later Byzantine writers. This volume gathers the translated fragments, drawn from books 2, 3, 4, 7, 8, 9, and 13: poisons and antidotes, veterinary charms, military stratagems, and the farm and household lore of the ancient world. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
