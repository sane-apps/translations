edition: "PG 10; Cesti fragmenta (Khazarzar)"
status: tip
scope: "Tip of the locked PG 10 / Khazarzar Cesti fragmenta: book 7 through colophon, book 2.1–2.12, book 3.1–3.36, book 4.1, Cestus 18 colophon, 13.22, 8.2, and 9.1–9.5. Book-7 appendix held. Book-2 pinax held. (No 3.20 in the lock.) This lock is exhausted."
