title: "Three Homilies on the Dormition of the Mother of God (Greek; PG 96)"
author: "John of Damascus"
description: "John of Damascus preached these three sermons on the falling asleep of Mary, the Mother of God, at her tomb in Gethsemane. The second quotes the Euthymian History of her empty tomb. This volume holds all three homilies. Fresh English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
