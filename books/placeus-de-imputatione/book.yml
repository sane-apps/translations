title: 'Josué de la Place: On the Imputation of Adam''s First Sin (selections)'
original_title: 'De imputatione primi peccati Adami'
author: Josué de la Place (Placeus)
description: "On the Imputation of Adam's First Sin argues the distinctive Saumur thesis: Adam's sin reaches his posterity only mediately, through the inherited corruption — never by immediate reckoning of a sin they did not commit. Fellow Reformed theologians rejected the view, but the book remains its classic statement. This volume holds the opening movement: the first chapter with the probable and necessary arguments and the opening of the fourth. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
