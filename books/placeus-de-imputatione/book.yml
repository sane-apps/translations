title: "De imputatione primi peccati Adami (Caput Primum tip)"
author: "Josué de la Place (Placeus)"
description: "New English rendering of Josue de la Place's On the Imputation of Adam's First Sin for private study, prepared with AI assistance from the Latin text of the 1661 Saumur edition. This volume covers the First Chapter (the Charenton National Synod decree on original sin and Placeus's framing reply, answering the rumor of his condemnation) in 2 sections; the remainder is not in this volume. No modern copyrighted translation was copied."
