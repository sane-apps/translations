title: 'Josué de la Place: On the Imputation of Adam''s First Sin (selections)'
original_title: 'De imputatione primi peccati Adami'
author: Josué de la Place (Placeus)
description: New English rendering of Josue de la Place's On the Imputation of Adam's
  First Sin for private study, prepared with AI assistance from the Latin text of
  the 1661 Saumur edition. Covers Capita I–IV through Drelincourt, Caput V plan, Caput
  VI Maresius arguments, and Caput VII tip; remainder of Cap. VII and later Capita
  of the Disputatio are not in this volume. No modern copyrighted translation was
  copied.
