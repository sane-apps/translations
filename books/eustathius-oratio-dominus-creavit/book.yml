description: "Eustathius of Antioch, Oration on “The Lord Created Me”. Eustathius defends the full divinity of the Word against those who interpreted Proverbs 8:22 (“The Lord created me”) as applying to the divine Son, and he recounts the maneuvers of Eusebius’ party at the Council of Nicaea. New English for private study from the locked source. Source: PG 18; Oratio in illud Dominus creavit me (Khazarzar)."
