title: 'Gregory Thaumaturgus: Sermon on All Saints'
original_title: 'Sermo in omnes sanctos'
author: "Gregory Thaumaturgus"
description: "The Sermon on All Saints, preached for a martyrs' feast, moves from the speaker's unworthiness to Christ's despoiling of Hades. It is transmitted under Gregory's name. This volume holds the opening: silence preferred, yet the martyrs' feast compelling speech, through Christ despoiling Hades. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
