title: "Gregory Thaumaturgus: Sermo in omnes sanctos"
author: "Gregory Thaumaturgus"
description: "New English rendering of the Sermon on All the Saints transmitted under the name of Gregory Thaumaturgus for private study, prepared with AI assistance from the Greek text of the Documenta Catholica Omnia edition (cf. Migne, PG 10). This volume covers the opening (silence preferred, yet the feast of the martyrs compels speech, through Christ despoiling Hades); the remainder is not in this volume. Attribution to Gregory is disputed in modern scholarship. No modern copyrighted translation was copied."
