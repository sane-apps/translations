title: 'Gregory Thaumaturgus: Sermon on All Saints'
original_title: 'Sermo in omnes sanctos'
author: "Gregory Thaumaturgus"
description: "The Sermon on All Saints, preached for a martyrs' feast, moves from the speaker's unworthiness through Christ's despoiling of Hades to the devil's endless defeat. It is transmitted under Gregory's name. This volume holds the whole sermon, from the preacher's wish to keep silent to the closing doxology. Fresh English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
