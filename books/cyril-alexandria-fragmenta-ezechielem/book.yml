slug: cyril-alexandria-fragmenta-ezechielem
title: "Fragments on Ezekiel"
original_title: "Fragmenta in Ezechielem"
author: Cyril of Alexandria
description: "Cyril of Alexandria's comments on single verses of Ezekiel, kept in the catenae, in a fresh English translation from the Greek. They cover the living creatures, the disciples as doves, Noah, Daniel and Job, the cedar shoot from David's line, the ordinances that were not good, the greedy shepherds, and the promise of one shepherd, which Cyril reads of Christ."
language: Greek
edition: "PG 70; Fragmenta in Ezechielem"
status: available
scope: "All the Ezekiel fragments printed in PG 70, in four sections."
notes: |
  Copy-text: PG 70 Greek, Fragmenta in Ezechielem (Khazarzar scan of PG 68-77).
  Catena folio references and PG column numbers are left out of the reading text.
