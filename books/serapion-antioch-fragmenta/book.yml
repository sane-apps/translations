title: 'Serapion of Antioch: Fragments'
original_title: 'Fragmenta'
author: "Serapion of Antioch"
description: "His most famous hour came at Rhossus, where Christians were reading the so-called Gospel of Peter. Serapion first permitted the book, then read it, found heresy, and wrote to warn them — a second-century lesson in pastoral discernment, preserved in Eusebius's history (6.12). This volume holds the Gospel of Peter fragment addressed to Rhossus; the remaining scraps will follow. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
edition: "Reliquiae Sacrae (Routh 1846); Eusebius HE 6.12; tip densify Gospel of Peter fragment"
