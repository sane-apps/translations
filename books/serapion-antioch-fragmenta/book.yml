title: "Serapion of Antioch: Fragmenta"
author: "Serapion of Antioch"
description: "New English rendering of Serapion of Antioch's Fragments for private study, prepared with AI assistance from the Greek text of Routh's Reliquiae Sacrae, cross-checked against Eusebius. This volume covers the fragment On the So-Called Gospel of Peter, addressed to the church at Rhossus; the other surviving Serapion scraps are not in this volume. No modern copyrighted translation was copied."
