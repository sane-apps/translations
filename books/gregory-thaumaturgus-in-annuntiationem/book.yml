title: 'Gregory Thaumaturgus: Homilies on the Annunciation'
original_title: 'In annuntiationem'
author: "Gregory Thaumaturgus"
description: "The Homilies on the Annunciation celebrate Gabriel's visit to Mary — David's oracle, the angel's greeting, and Mary's reply. They are transmitted under Gregory's name, though scholars generally count them the work of a later hand. This volume holds the opening of the First Discourse: the joy of the day, through Gabriel's reply. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
edition: "Vossius 1684 Opera omnia Latin column (In annuntiationem Sermo I); tip densify opening through Gabriel reply; Greek column OCR damaged"
