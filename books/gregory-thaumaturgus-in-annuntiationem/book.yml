title: "Gregory Thaumaturgus: In annuntiationem"
author: "Gregory Thaumaturgus"
description: "New English rendering of Gregory Thaumaturgus's On the Annunciation to the Holy Virgin Mary for private study, prepared with AI assistance from the Latin text (Vossius edition, 1684). Covers the opening of the First Discourse (the joy of the day, David's oracle, Gabriel's hail through his reply); the rest of Sermo I and Sermones II-III are not in this volume. No modern copyrighted translation was copied."
