title: 'Gregory Thaumaturgus: Homilies on the Annunciation'
original_title: 'In annuntiationem'
author: "Gregory Thaumaturgus"
description: "The Homilies on the Annunciation celebrate Gabriel's visit to Mary — David's oracle, the angel's greeting, and Mary's reply. They are transmitted under Gregory's name, though scholars generally count them the work of a later hand. This volume holds the whole First Discourse: the joy of the day, Gabriel's greeting and Mary's questions, Mary's wisdom undoing Eve's fall, the angel's praises of the Virgin, and the birth at Bethlehem. The Second and Third Discourses are not yet translated. Fresh English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
edition: "Opera omnia, Greek and Latin (Paris, 1622), Latin column (In annuntiationem Sermo I, printed pp. 9-15); Greek column OCR damaged"
