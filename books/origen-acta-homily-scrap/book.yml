description: "Origen of Alexandria, Fragment from the Homilies on the Acts of the Apostles. Origen is expounding from the fourth homily on Acts, citing Acts 1:16 where Peter says the Scripture about Judas had to be fulfilled. The fragment addresses an objection about who is speaking in the Psalm: whether it is the Holy Spirit or the Savior. New English for private study from the locked source. Source: PG 14; Fragmentum in Acta (Khazarzar)."
