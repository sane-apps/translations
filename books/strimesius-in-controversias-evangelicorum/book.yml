title: 'Samuel Strimesius: Candid Examination of the Gospel Controversies (selections)'
original_title: 'Ingenua in Controversias Evangelicorum'
author: "Samuel Strimesius"
description: "Samuel Strimesius — Prefatio §I–II, Crimina defenses through Crimina III, Part I Protheoria through Cassel, Obices/Historia degrees, Formula Discord/Disparitas, Ulterius confirmatur, two controversy classes, Formula of Concord protest, threefold later controversy map, Coena Domini body start, Controversiae Post Lutherum Controv. III–XIII openings (through Controv. XIII De Ritibus), Controv. XV De Tolerantia mutua, Hexades Annotationum Prooemium H.I–§.III, and Annotatio I De Augustana Confessione §.I–§.VIII (Augsburg Confession definition through edition wars, Variata, Dorsche subsumption, and Art. X / Philippica wording) from Ingenua in Controversias Evangelicorum (Frankfurt an der Oder, 1708). Honest partial; Prefatio silence reasons, Annotatio I §.IX+, Hexades theses body, and the rest of the Controversiae / folio remain. No modern copyrighted translation was copied."
edition: "Ingenua in Controversias Evangelicorum (Francofurti ad Viadrum: Jer. Schrey & J. C. Hartmann, 1708). Google Books 3epYAAAAcAAJ (ONB). Densify: Prefatio §I–II + Crimina heads + Crimina defenses through III + Part I Protheoria through Cassel Art. III–V, Obices/Historia/Varii gradus, Formula Discord/Disparitas, Ulterius confirmatur / Controversiarum Classes / Formula protest / triplex differentia, Coena Domini body start (Unde initium Schismatis Q.I–II through Precariae Hypotheses; Controv. pp. 34–40), Controversiae Post Lutherum Natae Controv. III Q.I on Providence (God author of sin charge through Rinteln softening reciprocity; Controv. pp. 40–43), Controv. IV opening on general/antecedent will (through unstable props of grace-universality; Controv. pp. 43–46), Controv. V opening on election according to foresight of faith (through Protheoria cross-ref before Reprobation; Controv. pp. 46–49), and Controv. VI opening on absolute a-priori reprobation / preterition (through mutual concessions; Controv. pp. 49–53), Controv. VII tip on universal death of Christ (through Lutheran≠Remonstrant close; Controv. p. 53), and Controv. VIII opening on converting grace resistible/superable (through πρῶτα ψεύδη before Controv. IX De Perseverantia; Controv. pp. 54–56) (not Prefatio silence reasons; not Controv. IX / rest of Post Lutherum; not Hexades theses body; not whole Controversiae; not whole folio)"
