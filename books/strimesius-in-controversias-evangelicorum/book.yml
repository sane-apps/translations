description: "New English rendering of Samuel Strimesius's A Candid Inquiry into the Controversies among Evangelicals for private study, prepared with AI assistance from the Latin text of the 1708 Frankfurt-an-der-Oder edition. This volume covers the Pacific-Apologetic Preface section I (the call for Protestant church peace, weighed by Scripture alone, undertaken at Frankfurt in 1679) in 2 sections; the remainder is not in this volume. No modern copyrighted translation was copied."
