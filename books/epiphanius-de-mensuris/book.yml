title: 'Epiphanius of Salamis: On Weights and Measures'
original_title: 'De mensuris'
author: "Epiphanius of Salamis"
description: "On Weights and Measures, written near the end of his life, is his guide to the Bible's world: Hebrew weights, measures, and coins, the ancient translators of the Old Testament, and the books of Scripture — antiquarian lore in service of the reader. This volume holds Chapter I: measures and weights, the ten prophetic genres, and prophetic signs. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
