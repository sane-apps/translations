description: "The Dialogue with Heraclides records a real church council in Arabia (c. 244–249), where Origen gently corrected Bishop Heraclides on the Trinity and the resurrection — stenographers' minutes of theology done face to face. On Pascha sets out the meaning of Christ our Passover. This volume holds the Dialogue and On Pascha, with navigable Bible references. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
