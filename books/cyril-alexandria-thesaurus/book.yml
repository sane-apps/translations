description: 'Cyril of Alexandria, Thesaurus on the Holy Trinity. The prologue and a short opening of each discourse: the Father and the unbegotten, the consubstantial Son, "the Father is greater than I," and the Spirit who is God from the Father. This is not the Dialogues on the Holy Trinity. New English for private study from the locked source. Source: PG 75.'
