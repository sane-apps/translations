description: "Cyril of Alexandria, Fragments on Daniel. The surviving fragments comment on Daniel's vision of the Ancient of Days and the Son of Man, explaining how the Son's coming to the Ancient of Days is not spatial but refers to his entering the Father's glory. New English for private study from the locked source. Source: PG 70; Fragmenta in Danielem."
