description: "Amphilochius of Iconium, Synodical Letter. A synod over which Amphilochius presided received a common letter from a distant church asking for a ruling on the faith, particularly on the Holy Spirit. Since Basil was prevented by illness from attending, Amphilochius replies on behalf of the synod, attaching Basil's own treatise on the subject. New English for private study from the locked source. Source: PG 39; Epistula synodalis (Khazarzar)."
