description: "Eustathius of Antioch, On Faith against the Arians. The surviving fragment defends the full divinity of Christ against Arian claims by interpreting Christ's saying 'I am the way and the truth and the life.' It argues that the human 'way' leads believers to the divine 'truth and life' of the Father. New English for private study from the locked source. Source: PG 18; De fide contra Arianos (Khazarzar)."
