description: "Origen of Alexandria, Homilies on Exodus. Rufinus translated them. The midwives, the plagues, the song at the sea, Marah, the manna, the veil on Moses, and the tabernacle. These are not his notes on Exodus, and they are not his selections on Exodus. New English for private study from the locked source. Source: Baehrens, Origenes Werke VI = GCS 29 (1920)."
