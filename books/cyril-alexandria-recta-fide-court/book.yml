title: 'Cyril of Alexandria: On the True Faith to the Imperial Women'
author: "Cyril of Alexandria"
slug: "cyril-alexandria-recta-fide-court"
description: "On the True Faith comprises two treatises written as the crisis broke for the women of that household — the princesses Arcadia and Marina, and the Augustas Pulcheria and Eudocia — arguing that Mary is truly Theotokos, Mother of God, because her Son is one divine person. This volume holds both court treatises. The companion treatise To Theodosius, which already has a modern English version, is not included. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
