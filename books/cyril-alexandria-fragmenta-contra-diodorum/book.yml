description: "Cyril of Alexandria, Fragments from the Book against Diodore of Tarsus. The lines that survive are the homily on the day and the hour: Christ speaks in a veiled way, and even an adopted son must not seek what is beyond nature. New English for private study from the locked source. Source: PG 76."
