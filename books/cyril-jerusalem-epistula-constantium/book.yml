description: "Cyril of Jerusalem, Letter to Constantius. Cyril writes to report a luminous cross that appeared in the sky over Jerusalem during the days of Pentecost, stretching from Golgotha to the Mount of Olives, and to interpret it as a divine sign favoring the emperor. New English for private study from the locked source. Source: PG 33; Epistula ad Constantium imperatorem (Khazarzar)."
