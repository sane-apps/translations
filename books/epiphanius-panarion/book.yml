title: 'Epiphanius of Salamis: The Panarion (Against Heresies)'
original_title: 'Panarion'
author: "Epiphanius of Salamis"
description: "The Panarion — the 'medicine chest' (374–377) — is his vast antidote to heresy: sect after sect described and refuted in turn, from the beginnings of error to the controversies of his own day. This volume opens at the beginning: Heresy I, chapter V, where no heresy has yet appeared — Adam as prophet of Father, Son, and Spirit. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
