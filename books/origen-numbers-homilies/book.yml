title: 'Origen of Alexandria: Homilies on Numbers'
author: "Origen of Alexandria"
description: "The twenty-eight Homilies on Numbers, surviving in Rufinus's Latin, turn the wilderness census into spiritual counsel: the church's warfare, Balaam's oracle, and the cities of refuge. This volume holds Homilies I–II and IV–XXVIII, in eighty-three sections; Homily III is lost to a torn page in the copy-text and cannot be recovered. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
