title: "Origen: Homilies on Numbers"
author: "Origen of Alexandria"
description: "New English rendering of Origen of Alexandria's Homilies on Numbers for private study, prepared with AI assistance from the Latin text of Baehrens's edition (GCS 30, 1921), Rufinus's Latin version of the homilies. This volume holds Homilies I-II and IV-XXVIII (83 sections); Homily III is absent through an unrecoverable title lacuna in the copy-text, so this volume is not presented as a complete text. No modern copyrighted translation was copied."
