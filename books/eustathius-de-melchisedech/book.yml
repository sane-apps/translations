description: "Eustathius of Antioch, On Melchizedek. Eustathius writes to correct errors about Melchizedek, especially the view that he was greater than Christ or was the Holy Spirit, and to explain why Scripture calls him without father, without mother, and without genealogy. New English for private study from the locked source. Source: PG 18; De Melchisedech (Khazarzar)."
