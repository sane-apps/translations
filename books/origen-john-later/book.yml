description: "Origen of Alexandria, Commentary on John. This file is books 13, 19, 20, 28, and 32: the Samaritan woman, the treasury, Abraham's children, Lazarus, and the washing of the feet. It is not a continuous run of those books, and it is not Chrysostom's homilies on John. New English for private study from the locked source. Source: Preuschen, Origenes Werke IV = GCS 10 (1903)."
