description: "Origen of Alexandria, Fragment from the Commentary on Hosea. Origen addresses a textual difficulty in Hosea where plural verbs shift to a singular, because some readers suspect an error and alter the wording. He explains the apparent solecism by showing that Scripture deliberately uses singular and plural to teach about unity with God. New English for private study from the locked source. Source: PG 13; Fragmentum in Osee (Khazarzar)."
