description: "Eustathius of Antioch, Commentary on Psalm 92. The surviving fragments explain how Psalm 92's language about an anointed king applies to Christ, distinguishing what belongs to his divine nature from what belongs to his assumed human nature. New English for private study from the locked source. Source: PG 18; Commentarius in Psalmum 92 (Khazarzar)."
