description: "Hesychius of Jerusalem, Homily II on the Holy Pascha. The trumpet from Bethlehem and Zion, the tomb, the one Logos who became flesh, and the word that the Nazarene is not here, for he has risen. It is not Homily I on the holy Pascha. New English for private study from the locked source. Source: PG 93."
