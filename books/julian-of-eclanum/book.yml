description: "None of Julian's works survives directly; what remains is preserved in the long quotations of Augustine, who answered him book by book. Reconstructed from those hostile pages, Julian emerges as a formidable defender of free will, marriage, and the goodness of creation. This volume gathers the surviving arguments: the six books To Florus with the earlier fragments and letter material, each with its source locator. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
