description: "Eustathius of Antioch, On the Soul against the Arians. Eustathius writes against Arian claims that Christ assumed a body without a human soul. He argues from Christ's birth, growth, suffering, death, and resurrection that he possessed a real human body with a soul, and specifically that Christ's soul led the thief's soul into paradise, proving the soul's distinct reality and continued existence apart from the body. New English for private study from the locked source. Source: PG 18; De anima…"
