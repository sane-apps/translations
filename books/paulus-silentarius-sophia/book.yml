title: 'Paul the Silentiary: Description of Hagia Sophia'
original_title: 'Descriptio Sanctae Sophiae'
author: "Paulus Silentarius"
description: "His Description of Hagia Sophia — 1,046 hexameters for the church's rededication in December 563, after the new dome rose over the city — walks the reader through nave and dome, exedras and piers: the great church as a meadow of marble. This volume holds the poem complete in its three movements. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
edition: "Paulus Silentarius, Descriptio Sanctae Sophiae. PG 86b (Migne). Also Friedländer 1912 Teubner edition. De Stefani 2011 Teubner edition available"
