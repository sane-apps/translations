title: "Paulus Silentarius: Descriptio Sanctae Sophiae"
author: "Paulus Silentarius"
description: "New English rendering of Paulus Silentarius's Description of Hagia Sophia for private study, prepared with AI assistance from the Greek text (Migne, PG 86b; Friedlander 1912). The 1,046 hexameter verses celebrate the church's rededication on 24 December 563 in three movements: the dome and nave, the exedras and piers, then the ambo and conclusion. No modern copyrighted translation was copied."
