description: "Fresh English translation of Gregory Thaumaturgus's Disputation on the Soul addressed to Tatian, prepared with AI assistance from the Latin text (Opera omnia, Paris, 1622). Covers the whole treatise: the preface, the plan of inquiry and seven short chapters; by the terms of the disputation itself no Scripture testimonies are argued here. No modern copyrighted translation was copied."
