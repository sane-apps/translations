description: "Epiphanius of Salamis, Letter to John of Jerusalem. Epiphanius writes to John of Jerusalem to explain and defend his action of tearing a curtain with a painted human image in a church at Anautha, and to send what he has obtained as a replacement. New English for private study from the locked source. Source: PG 41-43; Epistula ad Joannem Hierosolymitanum (Khazarzar)."
