title: "Fragmenta in epistulam ad Romanos"
author: Cyril of Alexandria
description: "Cyril of Alexandria's surviving comments on Paul's Letter to the Romans, in a fresh English translation from the Greek. He explains the law and grace, Adam and Christ, baptism, the flesh and the Spirit, and God's mercy to Israel and to the nations."
language: Greek
edition: "PG 74; Fragmenta in Romanos"
status: available
scope: "The surviving fragments of Cyril's commentary on Romans, as printed in PG 74, on Romans 1 to 15. Many fragments begin or end mid-sentence."
notes: |
