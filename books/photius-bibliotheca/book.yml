title: 'Photius of Constantinople: The Library (selections)'
original_title: 'Bibliotheca (Myriobiblon)'
author: "Photius of Constantinople"
description: "The Library (the Myriobiblon) is his reading journal on a heroic scale: summaries and judgments of 279 books, pagan and Christian, many of which survive nowhere else. This volume holds the opening stretch, Codices 1–22: Theodore, Eusebius, Origen, Apollinaris, Gelasius, and the councils of Ephesus and Chalcedon. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
