description: "Origen of Alexandria, Homilies on Isaiah and Ezekiel. Jerome translated them. Isaiah: the death of Uzziah, the throne, the seraphim, Immanuel, and the coal on the lips. Ezekiel: the captives, Noah, Daniel, and Job, the two eagles, the prince of Tyre, and the closed gate. These are not the fragments of his commentary on Ezekiel. New English for private study from the locked source. Source: Baehrens GCS 33 / Origenes Werke VIII (1925)."
