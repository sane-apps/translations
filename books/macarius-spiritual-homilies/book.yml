title: 'Macarius the Egyptian: The Spiritual Homilies'
author: "Macarius the Egyptian"
description: "Whoever wrote them, the Homilies rank among the most beloved works of Christian spirituality: intimate, experiential sermons on the heart's encounter with grace — prayer, temptation, the Spirit's transforming work, and the soul as God's dwelling. This volume holds Homilies 5 and 6; the remaining homilies toward the full fifty will follow. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
