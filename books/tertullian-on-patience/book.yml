description: "Tertullian, On Patience. Tertullian confesses he is himself weak in patience, but writes to commend it because no command of God or work pleasing to him can be performed without it. He presents patience as the central discipline of Christian life, grounded in the example of God and Christ. New English for private study from the locked source. Source: Emil Kroymann Tertullian Quinti Septimi Florentis Tertulliani opera F. Tempsky G. Freytag Vienna Leipzig 1900 3…."
