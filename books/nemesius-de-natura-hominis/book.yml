title: 'Nemesius of Emesa: On the Nature of Man'
original_title: 'De natura hominis'
author: "Nemesius of Emesa"
description: "On the Nature of Man joins Christian doctrine to Greek philosophical psychology — against Platonists, Stoics, and physicians alike, Nemesius argues the soul is an immortal rational substance, not blood, breath, harmony, or number, and defends free will and providence. This volume holds the opening soul arguments (1.1–3.1). New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
