title: "Nemesius: De natura hominis"
author: "Nemesius of Emesa"
description: "New English rendering of Nemesius of Emesa's On Human Nature for private study, prepared with AI assistance from the Greek text of the Wither 1636 edition (checked against Migne, PG 86, and BIUSante). This volume covers the soul arguments in sections 1.1-3.1: the soul as living substance in act, not the body's entelechy; refusals of soul-as-blood, breath, harmony, or number; and Moses on God's rest (Genesis 2:2; John 5:17). A 1636 English version by Wither exists in the public domain; this is a fresh rendering from the Greek, not a claim of first-ever English. No modern copyrighted translation was copied."
