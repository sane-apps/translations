title: "Syntagma sacrae theologiae (Liber I Cap. 1 tip)"
author: "Ludwig Crocius"
description: "New English rendering of Ludwig Crocius's Syntagma sacrae theologiae for private study, prepared with AI assistance from the Latin text (Bremen: Villerian, 1636). Covers Liber Primus Caput Primum on the definition of theology (sacred over against profane, a practical habit ordered to faith and eternal life); the remainder of the Syntagma is not in this volume. No modern copyrighted translation was copied."
