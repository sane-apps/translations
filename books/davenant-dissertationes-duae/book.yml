description: "New English rendering of John Davenant's Dissertationes duae for private study, prepared with AI assistance from the Latin text (Cambridge: Roger Daniel, 1650). Covers De morte Christi Cap. 1 (controversy origin + Thesis 1 scriptural proof), Cap. 2 Ratios 1 through the ultima ratio, Cap. 3 Satisfit preface through Obj. 17 (Cap. 3 close), Cap. 4 Thesis 2 tip through Mem. 3 possible-faith remainder (Thesis 2 close), Cap. 5 Thesis 3 tip through Mem. 2 Scripture close, Cap. 5 Mem. 2 Rat. 1-4, and Cap. 5 Mem. 2 Fathers tip; Cap. 5 Mem. 2 objections through Cap. 11 and De praedestinatione are not in this volume. No modern copyrighted translation was copied."
