description: "New English rendering of John Davenant's Dissertationes duae for private study, prepared with AI assistance from the Latin text (Cambridge: Roger Daniel, 1650). Covers De morte Christi Chapter 1 (the origin of the controversy and Thesis 1, on the death of Christ as a universal remedy); the remainder of the Dissertationes is not in this volume. No modern copyrighted translation was copied."
