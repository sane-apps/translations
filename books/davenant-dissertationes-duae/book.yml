title: 'John Davenant: Two Dissertations (selections)'
original_title: 'Dissertationes duae'
author: "John Davenant"
description: "The Two Dissertations (1650) press two theses: that Christ died sufficiently for all, and that God sincerely calls all who hear the gospel — against the novel claim that Christ died only for the elect in every sense. They are Davenant's mature statement of the hypothetical-universalist position that divided English Calvinists. This volume covers the opening of the first dissertation through the close of chapter 3, with the theses on the extent of Christ's death. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
edition: "Dissertationes duae (Cambridge: Roger Daniel, 1650). Partial through De praedestinatione Cap. 1 subject tip. Cap. 1 mid-Thesis+ remain"
