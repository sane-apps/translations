description: "Eustathius of Antioch, On the Inscription of the Titles. The surviving fragments explain the meaning of the stone pillar that Jacob set up at Bethel, interpreting it as a prophecy of Christ, the cross, and the two peoples. The work appears to be a theological exposition of the biblical narrative for a Christian audience. New English for private study from the locked source. Source: PG 18; In inscriptione titulorum (Khazarzar)."
