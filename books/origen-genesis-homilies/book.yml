description: "Origen of Alexandria, Homilies on Genesis. Rufinus translated them. The beginning and the ark, Abraham at Mamre, the binding of Isaac, Jacob's ladder, and Joseph in the pit. These are not his notes on Genesis, not his selections on Genesis, and not Didymus the Blind's On Genesis. New English for private study from the locked source. Source: Baehrens, Origenes Werke VI = GCS 29 (1920)."
