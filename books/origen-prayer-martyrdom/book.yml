description: "On Prayer (c. 233) is the first Christian treatise on prayer: why we pray, to whom, and how — closing with a full exposition of the Lord's Prayer. The Exhortation to Martyrdom (235) urges Ambrose and Protoctetus to stand firm as Maximin's persecution begins. This volume holds the complete surviving text of both treatises. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
