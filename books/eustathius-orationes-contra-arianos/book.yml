description: "Eustathius of Antioch, Orations against the Arians. Eustathius writes to refute Arian claims about Christ, specifically their selective use of a scriptural passage to say that Christ sinned while omitting the statement that God was in Christ reconciling the world to himself. New English for private study from the locked source. Source: PG 18; Orationes contra Arianos (Khazarzar)."
