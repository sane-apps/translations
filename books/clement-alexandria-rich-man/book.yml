description: "Clement of Alexandria, Who Is the Rich Man That Shall Be Saved?. Clement addresses believers who take Jesus' saying about the camel and the needle's eye literally and despair of rich Christians being saved, and he also criticizes those who flatter the rich. He writes to remove false despair and show how the rich may be saved. New English for private study from the locked source. Source: Clement of Alexandria Otto Stählin Stromata, Buch VII-VIII. Excerpta ex Theodoto. Eclogae prophetica.…"
