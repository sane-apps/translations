title: "Paulus Silentarius: Descriptio Ambonis"
author: "Paulus Silentarius"
description: "New English rendering of Paulus Silentarius's Description of the Ambo of Hagia Sophia for private study, prepared with AI assistance from the Greek text (Migne, PG 86b; Friedlander 1912). The poem (275 hexameter verses with a 29-verse trimeter prologue) was recited separately after the main Hagia Sophia ekphrasis, likely at Epiphany 563. No modern copyrighted translation was copied."
