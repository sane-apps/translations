title: 'Paul the Silentiary: Description of the Pulpit of Hagia Sophia'
original_title: 'Descriptio Ambonis'
author: "Paulus Silentarius"
description: "His Description of the Pulpit celebrates the ambo of Hagia Sophia in 275 hexameter verses, with a 29-verse prologue: marble, silver, and carved Scripture raised into poetry, recited separately after the great church's rededication. This volume holds the prologue and poem in full. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
edition: "Paulus Silentarius, Descriptio Ambonis. PG 86b (Migne). Also Friedländer 1912 Teubner edition. De Stefani 2011 Teubner edition available"
