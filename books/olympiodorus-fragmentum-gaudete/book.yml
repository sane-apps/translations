description: "The short fragment on \"Rejoice in that day.\" Health itself is a pleasure, and Paul rejoiced in his sufferings, not only for the kingdom but because the suffering is a prize. The apostles left the council rejoicing that they were dishonored for the name of Jesus. Source: PG 93."
