description: "The Homilies on Jeremiah press judgment and repentance on a comfortable church, while the Homily on 1 Samuel 28 tackles the darkest text in Samuel — the medium of Endor and the apparition of the prophet. This volume holds the Jeremiah homilies with the 1 Samuel 28 homily, with navigable Bible references. New English translation © 2026 SaneApps, free to share and adapt with credit (CC BY 4.0)."
